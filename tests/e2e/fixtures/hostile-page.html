    <title>Ega hostile page fixture</title>

      * {
        line-height: 2 !important;
        letter-spacing: 0.05em;
      }
      body {
        font-family: Georgia, serif;
        font-size: 19px;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
        background: #fff;
      }
      h1 {
        font-family: 'Times New Roman', serif;
      }
      button {
        all: unset;
      }
      p {
        margin: 0;
        padding: 6px 0;
      }
      body.dark {
        background: #111;
        color: #eee;
      }
    </style>
  </head>
