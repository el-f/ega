<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source SVG for the Ega extension icon: the ע glyph in Gveret Levin
  (AlefAlefAlef, SIL OFL 1.1) on a blue to cyan gradient. The manifest uses
  the PNGs, which scripts/generate-icons.ts renders in headless Chromium from
  scripts/icon-font/GveretLevin-Regular.ttf; this SVG is a reference only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#32d3d3"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: 'Gveret Levin';
        src: url('../../../scripts/icon-font/GveretLevin-Regular.ttf') format('truetype');
      }
      .glyph {
        font-family: 'Gveret Levin', sans-serif;
        font-size: 104px;
        fill: #0a2550;
        stroke: #0a2550;
        stroke-width: 3;
        paint-order: stroke fill;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" class="glyph">ע</text>
</svg>
