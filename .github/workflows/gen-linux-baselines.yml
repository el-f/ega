name: Generate Linux E2E Baselines

# Regenerates the Linux pixel baselines and the design-rules gate baseline, and
# uploads them as the artifact `linux-snapshots-<sha>`. Run it from the Actions
# tab, or label a PR `update-baselines` when that PR changes pixel output or the
# design-rules findings on purpose. The maintainer downloads the artifact, copies
# the PNGs and design-rules-baseline.json into the tree, reviews the diff and
# commits. The gate baseline can only be recorded here: see the header of
# tests/e2e/design-rules.ts.
#
# It never pushes: writing snapshots back needs `contents: write`, which is a
# token a public repo should not hand a runner.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Capture linux snapshots
    # Gate on label name when triggered via PR; dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm gen:icons
      - name: Build with E2E hooks
        run: pnpm build
        env:
          EGA_E2E_HOOKS: '1'
      # `missing` writes the baseline but still fails the test, so the upload never runs. Keep the `=` — a bare flag eats the first spec path.
      - name: Update pixel snapshots (visual specs only)
        run: |
          pnpm exec playwright test --update-snapshots=changed \
            tests/e2e/visual-regression.spec.ts
        env:
          CI: '1'
          EGA_E2E_SKIP_BUILD: '1'
      # The gate compares on Linux only (DejaVu Sans text), so only this runner can say what it finds. Record mode rewrites the gate keys in the checkout; the next step uploads the file.
      - name: Record the design-rules baseline (gate keys)
        run: pnpm exec playwright test --retries=0 tests/e2e/design-rules.spec.ts
        env:
          CI: '1'
          EGA_DESIGN_RULES_RECORD: '1'
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-snapshots-${{ github.sha }}
          # linux only — the win32 baselines are untouched here and copying them back would be noise.
          path: |
            tests/e2e/**/*-snapshots/*-linux.png
            tests/e2e/design-rules-baseline.json
          retention-days: 7
          if-no-files-found: error
