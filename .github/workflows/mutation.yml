name: Mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A full run needs ~7 h at concurrency 2, so it runs as the shards in stryker.conf.mjs, ~2-3 h each; 350 stays under GitHub's 6h job ceiling.
    timeout-minutes: 350
    strategy:
      # A red shard must not cancel the other shards' multi-hour runs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      STRYKER_SHARD: ${{ matrix.shard }}
      STRYKER_SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutate
      # `break` judges the average of this shard's files; this fails any one file under 70, and a run whose survivors ran no test.
      - if: ${{ !cancelled() }}
        run: pnpm mutate:survivors --floor=70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true # diagnostic only — a storage-quota hit must not redden the gate
        with:
          name: mutation-report-${{ github.sha }}-shard-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore
