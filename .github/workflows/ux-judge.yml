name: UX Judge

# Behavior-grade UX judge on PRs that touch flow specs. Grades only the
# changed journeys (warn-only) and posts a summary comment so reviewers
# see the verdict without leaving the PR. Skips cleanly when the
# ANTHROPIC_API_KEY secret is absent — never fails the workflow on the
# missing key (e.g. fork PRs).
#
# Actions are pinned to full commit SHAs; bump the SHA and its tag comment together.

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/e2e/flows/**'
      - 'tests/journeys/rubric/**'
      - 'scripts/ux-judge/**'
      - '.github/workflows/ux-judge.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ux-judge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-judge:
    name: UX judge (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git diff origin/master...HEAD` needs both tips; the next step fetches the base ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF":refs/remotes/origin/master

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The judge grades journey sidecars, and the flow harness writes one per spec
      # only under EGA_UX_RECORD=1. Run just the changed flow specs to produce them.
      - name: Changed flow specs
        id: changed
        run: |
          FILES=$(git diff --name-only origin/master...HEAD -- 'tests/e2e/flows/**/*.flow.spec.ts' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.files != ''
        run: pnpm build
        env:
          EGA_E2E_HOOKS: '1'
      - if: steps.changed.outputs.files != ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Record journeys for the changed flows
        if: steps.changed.outputs.files != ''
        # A red spec still writes its sidecar (outcome "failed"), and the judge is
        # warn-only; ci.yml is the gate for the spec itself.
        continue-on-error: true
        env:
          EGA_UX_RECORD: '1'
          EGA_E2E_SKIP_BUILD: '1'
          CHANGED: ${{ steps.changed.outputs.files }}
        # CHANGED is a space-separated list, so it is left unquoted on purpose.
        run: pnpm exec playwright test $CHANGED --reporter=line

      - name: Run UX judge (warn-only)
        id: judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set — skipping UX judge."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm ux:judge:diff --warn-only --base origin/master
          # Capture the most recent diff report path for downstream steps.
          REPORT=$(ls -t tests/journeys/report/diff-*.md 2>/dev/null | head -n1 || true)
          if [ -n "$REPORT" ]; then
            echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload judge report
        if: steps.judge.outputs.report != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-judge-report-${{ github.event.pull_request.head.sha }}
          path: tests/journeys/report/diff-*.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment on PR
        if: steps.judge.outputs.report != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JUDGE_REPORT: ${{ steps.judge.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const report = process.env.JUDGE_REPORT;
            if (!report || !fs.existsSync(report)) {
              core.info('No report file — skipping PR comment.');
              return;
            }
            const raw = fs.readFileSync(report, 'utf-8');
            const lines = raw.split('\n');
            const summaryLine = lines.find((l) => l.startsWith('Summary:')) ?? '';
            // Top 5 finding headings — sections start with `## ` per writeRunMarkdown.
            const findings = lines.filter((l) => l.startsWith('## ')).slice(0, 5);
            const body = [
              '### UX judge — diff verdict',
              '',
              summaryLine || '_No summary available._',
              '',
              findings.length
                ? '#### Top findings\n' + findings.map((f) => `- ${f.replace(/^##\s*/, '')}`).join('\n')
                : '_No non-`ok` findings._',
              '',
              `Full report: \`${path.basename(report)}\` (uploaded as workflow artifact).`,
              '',
              '<sub>Warn-only — does not block merge. Set `EGA_UX_JUDGE_STRICT=1` to gate.</sub>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
